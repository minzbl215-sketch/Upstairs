<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d0e" />
<title>Lantai Atas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Literata:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="game-root">

    <!-- LOADING SCREEN -->
    <div id="loading-screen" class="screen">
      <div class="grain"></div>
      <div class="loading-eyes">
        <div class="loading-eye">
          <img src="assets/user-photo.jpg" onerror="this.src='assets/user-photo-placeholder.png'" alt="" />
        </div>
        <div class="loading-eye loading-eye--mark">
          <img src="assets/companion-mark.png" alt="" />
        </div>
      </div>
      <div class="loading-bar-track">
        <div id="loading-bar-fill"></div>
      </div>
      <p id="loading-status" class="loading-status">menyalakan lampu koridor...</p>
    </div>

    <!-- TITLE SCREEN -->
    <div id="title-screen" class="screen hidden">
      <div class="grain"></div>
      <div class="flicker-light"></div>
      <p class="title-eyebrow">unit 14B</p>
      <h1 class="title-main">LANTAI<br/>ATAS</h1>
      <p class="title-sub">bab satu &mdash; kunci lama</p>
      <button id="btn-start" class="btn-ghost">ketuk untuk masuk</button>
      <p class="title-hint">headphone disarankan</p>
    </div>

    <!-- CUTSCENE SCREEN -->
    <div id="cutscene-screen" class="screen hidden">
      <canvas id="cutscene-canvas"></canvas>
      <div class="grain"></div>
      <div id="cutscene-text"></div>
      <div id="cutscene-next">ketuk untuk lanjut ▸</div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen hidden">
      <canvas id="scene-canvas"></canvas>
      <div id="vignette"></div>
      <div class="grain"></div>

      <div id="interact-prompt" class="hidden">ketuk untuk berinteraksi</div>

      <div id="hud">
        <span id="scene-label"></span>
      </div>

      <!-- Dialogue box -->
      <div id="dialogue-box" class="hidden">
        <div id="dialogue-name"></div>
        <div id="dialogue-text"></div>
        <div id="dialogue-next">▾</div>
      </div>

      <!-- Jumpscare overlay -->
      <canvas id="jumpscare-canvas" class="hidden"></canvas>
    </div>

    <!-- END SCREEN -->
    <div id="end-screen" class="screen hidden">
      <div class="grain"></div>
      <h2 class="end-title">bersambung...</h2>
      <p class="end-sub">bab dua akan datang</p>
      <button id="btn-restart" class="btn-ghost">mulai ulang</button>
    </div>

  </div>

<script src="story.js"></script>
<script src="game.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
